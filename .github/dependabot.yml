version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
